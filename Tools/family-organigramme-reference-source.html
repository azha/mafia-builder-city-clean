<!doctype html>
<html><head><meta charset="utf-8">
<title>famille isolee</title>
<!--
  family-organigramme-reference-source.html — La Famille : l'organigramme (2026-08-21).

  Extrait ISOLÉ du markup+CSS du panneau « FAMILLE (organigramme) » de la maquette ratifiée user,
  REUSE verbatim depuis atelier3d-mafia/ecrans-brennar.html (voir ce fichier pour la provenance
  exacte de chaque règle CSS citée en commentaire — lignes 3-11 :root, 24-42 tete/corps/medl,
  50-84 bloc « FAMILLE : l'organigramme », 157-172 bloc « DOCTRINE FINALE : VERRE GRAVÉ + TAMPON »,
  183-196 bustes SVG, 208-248 markup HTML du panneau).

  ÉCHELLE — la maquette source est authorée pour le cadre PHONE `.tel{width:min(300px,88vw)}` (un
  preview de deck desktop) ; le client Unity range CE contrôleur (LieutenantScreenController) dans
  une "sheet" de largeur ÉTABLIE 560px (précédent : DashboardController cardRt.sizeDelta=560x560,
  LieutenantScreenController cardRt.sizeDelta=560x1480 — la restylisation de ce lot vit DANS la
  MÊME card que les sections Status/Reassign/Builder/Recruit inchangées, donc la largeur de la card
  ne peut pas changer sans casser ces sections voisines, hors périmètre de ce lot). Ce fichier
  applique donc un facteur d'échelle UNIQUE et UNIFORME 560/300 = 1.86667 à TOUTES les dimensions
  px de la maquette (tailles de police, paddings, gaps, rayons, diamètres de médaillon) — jamais une
  valeur réinventée, une SEULE multiplication mécanique appliquée partout, exactement l'opération
  que --force-device-scale-factor fait déjà pour la résolution physique (voir Tools/hud-topbar-
  reference-render.sh pour ce précédent). Les COULEURS restent verbatim (aucune couleur n'est mise
  à l'échelle). Voir implementation-notes.md § Deviations pour la décision consignée.

  Viewport = 560 CSS px (== la largeur RÉELLE de la card Unity, en unités canvas — le canvas entier
  est référencé 1280x720, CanvasScaler.referenceResolution, REUSE AppShell.cs:386).
-->
<style>
:root{
  --encre:#0b1016; --panneau:#111823; --lisere:#2a3648;
  --creme:#eae0c8; --creme-2:#b9ad92; --or:#d9ab4e; --or-vif:#f2c96b; --laiton:#b08d3e;
  --braise:#e0664a; --cyan:#7fd4d9;
  --tx-panneau: linear-gradient(160deg, rgba(22,33,53,.58), rgba(9,14,24,.74)); /* DOCTRINE FINALE, l.163 */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--encre);color:var(--creme);font:15px/1.55 "Segoe UI",Roboto,system-ui,sans-serif}
.serif{font-family:Georgia,"Times New Roman",serif}

/* .sheet == la card Unity (560px, SurfaceBg plein, PAS de bezel/voile — aucun écran shippé de ce
   dépôt n'implémente le fond ville-floutée du .tel/.ville/.voile de la maquette, mesuré Phase 1 :
   DashboardController.BuildLayout n'a qu'un flat Image(SurfaceBg) — voir implementation-notes.md). */
.sheet{width:560px;background:#16191b;display:flex;flex-direction:column}

.ecran{position:relative;display:flex;flex-direction:column}
.tete{display:flex;align-items:center;gap:18.67px;padding:26.13px 26.13px 18.67px;position:relative;
  background:radial-gradient(75% 150% at 50% 0%, rgba(217,171,78,.06), transparent 62%)}
.tete::after{content:"";position:absolute;left:22.4px;right:22.4px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--laiton) 30%,var(--laiton) 70%,transparent)}
.retour{width:56px;height:56px;border-radius:50%;border:1px solid #ffffff26;display:flex;align-items:center;
  justify-content:center;color:var(--creme-2);font-size:28px;background:#ffffff08}
.tete h3{margin:0;font-family:Georgia,serif;font-size:28px;letter-spacing:.16em;text-transform:uppercase;color:var(--or-vif);font-weight:400}
.tete .sous{font-size:16.8px;color:var(--creme-2);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:2px}
.corps{padding:18.67px 22.4px;display:flex;flex-direction:column;gap:14.93px}

/* médaillons-bustes (silhouettes maison, plus d'icônes du lot — l.40-47) */
.medl{width:70.93px;height:70.93px;border-radius:50%;flex:0 0 auto;position:relative;
  background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.05) 0deg 4deg, transparent 4deg 9deg),radial-gradient(circle at 38% 30%,#243048,#0f1622 66%);border:1.87px solid var(--laiton);
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.medl svg{width:74%;height:74%;display:block}
.medl.don{border-color:var(--or-vif);box-shadow:0 0 14.93px #d9ab4e33}
.medl.petit{width:48.53px;height:48.53px}
.buste-t{fill:#cfc4a6}
.rang .medl.dim{opacity:.55}

/* ── FAMILLE : l'organigramme ── (l.50-84, échelle 1.86667 appliquée aux dimensions) */
.don-rang{display:flex;align-items:center;gap:18.67px;padding:14.93px 18.67px;border-radius:22.4px;
  background:var(--tx-panneau);border:1px solid #d9ab4e44}
.don-rang .nom{font-family:Georgia,serif;font-size:27.07px;color:var(--or-vif)}
.don-rang .role{font-size:15.87px;letter-spacing:.16em;text-transform:uppercase;color:var(--creme-2)}
.arbre{position:relative;padding-left:26.13px;display:flex;flex-direction:column;gap:14.93px}
.arbre::before{content:"";position:absolute;left:9.33px;top:-11.2px;bottom:18.67px;width:1.87px;
  background:linear-gradient(180deg,var(--laiton),#b08d3e33)}
.rang{position:relative;display:flex;align-items:center;gap:16.8px;padding:14.93px 16.8px;border-radius:22.4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.5),0 4px 12px #000a;
  background:var(--tx-panneau);border-color:#ffffff24}
.rang::before{content:"";position:absolute;left:-16.8px;top:50%;width:16.8px;height:1.87px;background:var(--laiton)}
.rang.actif{border-color:#d9ab4e55;background:#101a2ae0}
.rang .qui{flex:1;line-height:1.25;min-width:0}
.rang .nom{font-family:Georgia,serif;font-size:25.2px;color:var(--creme)}
.rang .role{font-size:15.87px;letter-spacing:.13em;text-transform:uppercase;color:var(--creme-2)}
.rang .etat{text-align:right;line-height:1.3}
.rang .etat b{font-size:21.47px;font-weight:600;font-variant-numeric:tabular-nums}
.rang .etat span{display:block;font-size:14.93px;letter-spacing:.1em;text-transform:uppercase;color:var(--creme-2)}
.chip{display:inline-block;font-size:14.93px;letter-spacing:.08em;text-transform:uppercase;padding:3.73px 11.2px;border-radius:13.07px;border:1px solid}
.chip.del{color:var(--cyan);border-color:#7fd4d955}
.chip.self{color:var(--creme-2);border-color:#ffffff30}
.chip.ret{color:var(--braise);border-color:#e0664a55}
.equipe{position:relative;margin-left:48.53px;display:flex;flex-direction:column;gap:9.33px}
.equipe::before{content:"";position:absolute;left:-24.27px;top:-7.47px;bottom:14.93px;width:1.87px;background:#b08d3e55}
.eq-resume{position:relative;display:flex;gap:9.33px;flex-wrap:wrap;align-items:center;padding:3.73px 0}
.eq-resume::before{content:"";position:absolute;left:-24.27px;top:50%;width:16.8px;height:1.87px;background:#b08d3e55}
.eq-chip{display:flex;align-items:center;gap:9.33px;font-size:17.73px;color:var(--creme-2);
  background:#ffffff08;border:1px solid #ffffff1c;border-radius:16.8px;padding:3.73px 14.93px 3.73px 5.6px}
.homme{position:relative;display:flex;align-items:center;gap:14.93px;padding:9.33px 14.93px;border-radius:18.67px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.5),0 4px 12px #000a;
  background:var(--tx-panneau);border-color:#ffffff24}
.homme::before{content:"";position:absolute;left:-24.27px;top:50%;width:16.8px;height:1.87px;background:#b08d3e55}
.homme .nom{font-size:21.47px;color:var(--creme)}
.homme small{display:block;font-size:15.87px;color:var(--creme-2)}
.homme .ou{margin-left:auto;font-size:15.87px;color:var(--cyan);letter-spacing:.06em;text-align:right}
.vide{margin-top:4px;text-align:center;color:var(--creme-2);font-size:20.53px;padding:18.67px;border:1px dashed #ffffff22;border-radius:22.4px}
</style></head>
<body>

<!-- bustes silhouettes (symboles réutilisés — l.183-196 verbatim) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="buste-homburg"><path class="buste-t" d="M6 30 C6 22 12 19 16 19 C20 19 26 22 26 30 Z"/>
      <circle class="buste-t" cx="16" cy="12.5" r="4.6"/>
      <path class="buste-t" d="M8.5 9.5 Q16 4.5 23.5 9.5 L23 11 Q16 8.6 9 11 Z"/>
      <rect class="buste-t" x="12.6" y="5.2" width="6.8" height="4.4" rx="1.6"/></g>
    <g id="buste-fedora"><path class="buste-t" d="M6 30 C6 22.5 12 20 16 20 C20 20 26 22.5 26 30 Z"/>
      <circle class="buste-t" cx="16" cy="13" r="4.4"/>
      <path class="buste-t" d="M8 10.6 Q16 8.2 24 10.6 L23.2 12 Q16 10.2 8.8 12 Z"/>
      <path class="buste-t" d="M11.6 9.8 Q12.6 5.4 16.6 5.6 Q20.4 5.9 20.6 9.8 Q16 8.4 11.6 9.8Z"/></g>
    <g id="buste-casquette"><path class="buste-t" d="M6.5 30 C6.5 23 12 20.6 16 20.6 C20 20.6 25.5 23 25.5 30 Z"/>
      <circle class="buste-t" cx="16" cy="13.6" r="4.2"/>
      <path class="buste-t" d="M10.4 10.8 Q11 6.4 16 6.4 Q21 6.4 21.6 10.6 L22.8 11.4 L21.8 12.4 Q16 10.4 10.4 10.8Z"/></g>
  </defs>
</svg>

<div class="sheet"><div class="ecran">
  <!-- sous-titre : compte RÉEL de lieutenants uniquement (roster GET /v1/lieutenants) — la maquette
       affiche "3 lieutenants · 11 hommes" mais aucune donnée d'effectifs n'existe côté back (Phase 1,
       implementation-notes.md) ; jamais de compte fabriqué, cf CLAUDE.md. -->
  <div class="tete"><div class="retour">‹</div><div><h3>La Famille</h3><span class="sous">3 lieutenants</span></div></div>
  <div class="corps">
    <div class="don-rang"><div class="medl don"><svg viewBox="0 0 32 32"><use href="#buste-homburg"/></svg></div>
      <div><div class="nom">Don V.</div><div class="role">Vous</div></div></div>
    <div class="arbre">
      <div class="rang actif"><div class="medl"><svg viewBox="0 0 32 32"><use href="#buste-fedora"/></svg></div>
        <div class="qui"><div class="nom">Comptable</div><div class="role"><span class="chip del">Délégué</span></div></div>
        <div class="etat"><b>Actif</b><span>État</span></div></div>
      <div class="equipe">
        <div class="vide" style="margin-top:0">Aucune équipe rattachée</div>
      </div>
      <div class="rang"><div class="medl"><svg viewBox="0 0 32 32"><use href="#buste-fedora"/></svg></div>
        <div class="qui"><div class="nom">Sécurité</div><div class="role"><span class="chip self">Direct</span></div></div>
        <div class="etat"><b>Repos</b><span>État</span></div></div>
      <div class="equipe"><div class="eq-resume">
        <span class="eq-chip">Voir l'équipe</span>
      </div></div>
      <div class="rang"><div class="medl"><svg viewBox="0 0 32 32"><use href="#buste-fedora"/></svg></div>
        <div class="qui"><div class="nom">Blanchiment</div><div class="role"><span class="chip del">Délégué</span></div></div>
        <div class="etat"><b>Actif</b><span>État</span></div></div>
      <div class="equipe">
        <div class="vide" style="margin-top:0">Aucune équipe rattachée</div>
      </div>
    </div>
    <div class="vide">Recruter un nouveau lieutenant</div>
  </div>
</div></div>
</body></html>
