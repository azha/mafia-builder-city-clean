<!doctype html>
<html><head><meta charset="utf-8">
<title>bustes isoles</title>
<!--
  family-bustes-source.html — les 3 bustes silhouettes de "La Famille : l'organigramme"
  (homburg/fedora/casquette), REUSE verbatim des <path> SVG de la maquette ratifiée user
  (atelier3d-mafia/ecrans-brennar.html:184-195). Remplacent les icônes ("j'aime pas les icônes",
  verdict user) — ce sont des silhouettes maison, pas des pictogrammes.

  Rendues ISOLÉES ici (fond transparent, --default-background-color=00000000) pour être rasterisées
  en sprites Unity : Assets/Art/Lieutenant/ui_element_buste_{homburg,fedora,casquette}.png (préfixe
  `ui_element_` — import_settings.md invariant 1, W4P4aArtImportPostprocessor.cs).
  Le fill `#cfc4a6` (`.buste-t{fill:#cfc4a6}`, ecrans-brennar.html:39 zone médaillons) est BAKED dans
  le PNG — ce sont des assets d'art statiques (REUSE du patron déjà établi pour les 83 icônes/132
  tiles W3.U-DA : couleur baked au pixel, hors du namespace DesignTokens/R2.3 qui gouverne les
  Color C# — jamais de recolorisation par état dans la maquette, donc aucun besoin de tinting
  runtime). Taille de sortie : viewBox 32x32 rendu à 256x256 (8x, marge nette pour un import Unity
  sans flou), device-scale-factor=1 (le facteur d'échelle est dans le --window-size directement).
-->
<style>
html,body{margin:0;padding:0;background:transparent}
.medl-probe{width:256px;height:256px;display:flex;align-items:center;justify-content:center}
.buste-t{fill:#cfc4a6}
svg{width:100%;height:100%;display:block}
</style></head>
<body>
<div class="medl-probe" id="target">
  <svg viewBox="0 0 32 32" id="svgroot"></svg>
</div>
<script>
  // Le buste à rendre est choisi par ?g=homburg|fedora|casquette (query string) — un seul fichier
  // source, 3 rendus séparés (même patron que hud-topbar-reference-source.html : un fichier isolé,
  // un script wrapper qui pilote plusieurs passes).
  var params = new URLSearchParams(window.location.search);
  var which = params.get('g') || 'homburg';
  var groups = {
    homburg: '<path class="buste-t" d="M6 30 C6 22 12 19 16 19 C20 19 26 22 26 30 Z"/>' +
      '<circle class="buste-t" cx="16" cy="12.5" r="4.6"/>' +
      '<path class="buste-t" d="M8.5 9.5 Q16 4.5 23.5 9.5 L23 11 Q16 8.6 9 11 Z"/>' +
      '<rect class="buste-t" x="12.6" y="5.2" width="6.8" height="4.4" rx="1.6"/>',
    fedora: '<path class="buste-t" d="M6 30 C6 22.5 12 20 16 20 C20 20 26 22.5 26 30 Z"/>' +
      '<circle class="buste-t" cx="16" cy="13" r="4.4"/>' +
      '<path class="buste-t" d="M8 10.6 Q16 8.2 24 10.6 L23.2 12 Q16 10.2 8.8 12 Z"/>' +
      '<path class="buste-t" d="M11.6 9.8 Q12.6 5.4 16.6 5.6 Q20.4 5.9 20.6 9.8 Q16 8.4 11.6 9.8Z"/>',
    casquette: '<path class="buste-t" d="M6.5 30 C6.5 23 12 20.6 16 20.6 C20 20.6 25.5 23 25.5 30 Z"/>' +
      '<circle class="buste-t" cx="16" cy="13.6" r="4.2"/>' +
      '<path class="buste-t" d="M10.4 10.8 Q11 6.4 16 6.4 Q21 6.4 21.6 10.6 L22.8 11.4 L21.8 12.4 Q16 10.4 10.4 10.8Z"/>',
  };
  document.getElementById('svgroot').innerHTML = groups[which];
</script>
</body></html>
